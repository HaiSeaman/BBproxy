<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Orbital Ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="190 70" filter="url(#glow)"/>

  <!-- Inner Nodes -->
  <circle cx="46" cy="64" r="10" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="82" cy="64" r="10" fill="#818CF8" filter="url(#glow)"/>

  <!-- Transfer Arc -->
  <path d="M 46 54 A 18 18 0 0 1 82 54" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round"/>
</svg>
